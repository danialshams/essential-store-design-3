name: Build fast initial AirPods model
on:
  push:
    branches: [perf/airpods-instant-progressive]
    paths:
      - scripts/build-instant-model.sh
      - .github/workflows/airpods-instant.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instant-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate instant model
        run: bash scripts/build-instant-model.sh
      - name: Validate application
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit generated GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/airpods-max-instant.glb
          if ! git diff --cached --quiet; then
            git commit -m "Generate instant 3D geometry [skip ci]"
            git push origin HEAD:perf/airpods-instant-progressive
          fi
