name: Blender Pasta — Real 3D Render Proof

on:
  push:
    branches:
      - experiment/blender-pasta-proof-20261103
    paths:
      - ".github/workflows/blender-pasta-proof.yml"
      - "blender/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-pasta-proof
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout isolated prototype branch
        uses: actions/checkout@v4

      - name: Install official precompiled Blender 4.5 LTS (no slow apt dependency downloads)
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 \
            https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz \
            -o /tmp/blender-linux.tar.xz
          curl -fL --retry 3 --connect-timeout 20 --max-time 90 \
            https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 \
            -o /tmp/blender-official.sha256
          expected="$(grep 'blender-4.5.15-linux-x64.tar.xz' /tmp/blender-official.sha256 | grep -Eo '[a-f0-9]{64}' | head -n 1)"
          actual="$(sha256sum /tmp/blender-linux.tar.xz | awk '{print $1}')"
          test -n "$expected" && test "$expected" = "$actual"
          tar -xJf /tmp/blender-linux.tar.xz -C /tmp
          echo "/tmp/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
          /tmp/blender-4.5.15-linux-x64/blender --version
          command -v ffmpeg
          ffmpeg -version

      - name: Render 3D scene and animated ingredient separation
        run: |
          mkdir -p output/pasta
          blender --background --factory-startup --threads 2 \
            --python blender/pasta_scene.py -- \
            --output "$GITHUB_WORKSPACE/output/pasta"

      - name: Encode a playable preview from the rendered frames
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -framerate 12 -pattern_type glob -i 'output/pasta/frame-*.png' \
            -c:v libx264 -preset medium -crf 20 \
            -pix_fmt yuv420p -movflags +faststart \
            output/pasta/real-blender-pasta-preview.mp4

      - name: Verify Blender project, image frames and MP4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("output/pasta")
          frames = sorted(root.glob("frame-*.png"))
          assert len(frames) == 24, f"Expected 24 REAL Blender-rendered frames, found {len(frames)}"
          assert (root / "pasta-proof.blend").stat().st_size > 10000
          assert (root / "real-blender-pasta-preview.mp4").stat().st_size > 10000
          assert (root / "manifest.json").exists()
          print(json.dumps({"rendered_frames":len(frames),"first":frames[0].name,"last":frames[-1].name},indent=2))
          PY

      - name: Upload actual Blender project and rendered media
        uses: actions/upload-artifact@v4
        with:
          name: pasta-real-3d-proof
          path: output/pasta/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
