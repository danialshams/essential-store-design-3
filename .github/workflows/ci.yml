name: Validate AETHER premium site
on:
  push:
    branches: [main, feature/aether-gsap-glass-3d-gesture-fix]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and copy Draco decoder
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
