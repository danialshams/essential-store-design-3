name: Pasta source asset audit — original GLB and PBR (isolated)
on:
  push:
    branches: [experiment/blender-pasta-still-20261103]
    paths:
      - '.github/workflows/pasta-asset-audit.yml'
      - 'blender/pasta_still/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Inspect CC0 GLB source and PBR/HDRI availability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,json,html
          urls=[
            'https://www.innerscene.com/tools/library/3d-parts/plate-of-pasta-dbabea81',
            'https://api.polyhaven.com/files/wood_table',
            'https://api.polyhaven.com/files/warm_restaurant',
          ]
          for url in urls:
            print("\nURL",url,flush=True)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; BlenderAssetAudit/1.0)"})
              r=urllib.request.urlopen(req,timeout=25)
              data=r.read(4_000_000).decode('utf-8','replace')
              print("status",r.status,"len",len(data),"type",r.headers.get('Content-Type'))
              if 'api.polyhaven.com' in url:
                j=json.loads(data)
                print("top keys",list(j)[:25])
                print("sample",data[:1400])
              else:
                print("title",re.findall(r'<title>(.*?)</title>',data,re.I|re.S)[:1])
                matches=re.findall(r'.{0,160}(?:\.glb|assetUrl|downloadUrl|fileUrl|cdn\.|plate-of-pasta).{0,180}',data,re.I)
                print("asset tokens",len(matches))
                for m in matches[:30]:print(html.unescape(m).replace('\\/','/')[:380])
                hrefs=re.findall(r'(?:href|src)=["\\']([^"\\']+)["\\']',data)
                print("interesting hrefs",[h for h in hrefs if any(t in h.lower() for t in ['.glb','download','assets','models'])][:20])
            except Exception as e: print("ERROR",repr(e))
          PY
